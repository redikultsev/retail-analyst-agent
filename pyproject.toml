[project]
name = "retail-agent"
version = "0.1.0"
description = "Command line chat agent that answers retail analysis questions with safe BigQuery SQL"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.16.3",
    "rich>=15.0.0",
    "sqlglot==30.35.0",
    "typer>=0.29.2",
]

[project.scripts]
retail-agent = "retail_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
