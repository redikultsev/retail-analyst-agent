[project]
name = "retail-agent"
version = "0.1.0"
description = "Command line chat agent that answers retail analysis questions with safe BigQuery SQL"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-bigquery>=3.47.0",
    "langchain>=1.5.2",
    "langchain-google-genai>=4.5.3",
    "langfuse>=5.2.0,<6",
    "langfuse-lite==0.1.1",
    "pydantic-settings>=2.16.3",
    "rich>=15.0.0",
    "sqlglot==30.35.0",
    "typer>=0.29.2",
]

[project.scripts]
retail-agent = "retail_agent.app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
